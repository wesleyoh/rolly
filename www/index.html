<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fbf7ec">
<title>또르르</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 홈 -->
  <section id="home" class="screen">
    <div class="home-top">
      <button class="icon-btn" id="colBtn" aria-label="도감">도감</button>
      <span class="hint-count" id="homeHints"></span>
      <button class="icon-btn" id="setBtn" aria-label="설정">설정</button>
    </div>
    <h1 class="logo">또르르</h1>
    <p class="tag">선 하나로 굴려 넣기</p>
    <canvas id="mascot"></canvas>
    <button class="card daily" id="dailyCard">
      <span class="card-title">오늘의 문제 <b id="dailyNo"></b></span>
      <span class="dots" id="dailyDots"></span>
      <span class="card-sub" id="dailySub"></span>
    </button>
    <button class="card stage" id="stageCard">
      <span class="card-title">스테이지</span>
      <span class="card-sub" id="stageSub"></span>
    </button>
  </section>

  <!-- 스테이지 선택 -->
  <section id="worlds" class="screen" hidden>
    <div class="topbar"><button class="back" data-go="home">←</button><span class="tb-title">스테이지</span><span class="tb-right" id="starTotal"></span></div>
    <div class="tabs" id="worldTabs"></div>
    <div class="world-head" id="worldHead"></div>
    <div class="grid" id="stageGrid"></div>
  </section>

  <!-- 게임 -->
  <section id="game" class="screen" hidden>
    <div class="topbar"><button class="back" id="gameBack">←</button><span class="tb-title" id="gameTitle"></span><button class="hint-btn" id="hintBtn">힌트 <b id="hintN"></b></button></div>
    <div id="stage"><canvas id="c"></canvas><div id="bubble"></div></div>
    <div class="bar">
      <button class="retry" id="retryBtn" aria-label="다시">↺</button>
      <div class="inkwrap"><div id="ink"><div id="inkfill"></div><div id="par"></div></div><div class="inklabels"><span id="inktxt">잉크</span><span id="tries"></span></div></div>
    </div>
  </section>

  <!-- 도감 -->
  <section id="collection" class="screen" hidden>
    <div class="topbar"><button class="back" data-go="home">←</button><span class="tb-title">도감</span><span class="tb-right" id="colCoins"></span></div>
    <h3 class="sec" id="themeSec"></h3>
    <div class="items" id="themeGrid"></div>
    <h3 class="sec" id="skinSec"></h3>
    <p class="note" id="skinNote"></p>
    <div class="items" id="skinGrid"></div>
    <h3 class="sec" id="penSec"></h3>
    <div class="items" id="penGrid"></div>
  </section>
</div>

<div id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script src="game.js"></script>
</body>
</html>
